name: Packages core, hub, inventory, cloud
on:
  pull_request:
    paths: ['packages/**', '.github/workflows/core.yml']
  workflow_dispatch:
jobs:
  core:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: core
        working-directory: packages/core
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: hub (node:sqlite ledger, outbox, audit)
        working-directory: packages/hub
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: inventory (items, units, barcodes, ETA codes)
        working-directory: packages/inventory
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: cloud (Postgres RLS, tenant keys, device auth, ingest) - Linux and macOS only
        if: runner.os != 'Windows'
        working-directory: packages/cloud
        run: |
          npm ci
          npm run typecheck
          npm test
