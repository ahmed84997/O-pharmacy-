<title>O Pharmacy - Ribbon prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: a Word-style ribbon (tabs, labelled groups, collapse, Quick Access, key tips) above one working screen;
   on a phone the same data becomes a side menu. Dark-first, teal for structure, orange only for the one primary action. */
:root {
  --bg: #0B1120; --panel: #111A2E; --ribbon: #16233B; --line: #243552; --fg: #E7EEF8; --muted: #93A4BD;
  --teal: #2590AD; --teal-soft: #12384A; --orange: #F85A0A; --ok: #3FB68B; --warn: #E5A93B; --hover: #1D2F4D;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #EEF3F8; --panel: #FFFFFF; --ribbon: #F6F9FC; --line: #CBD7E6; --fg: #14233A; --muted: #55677F;
  --teal: #1B7B97; --teal-soft: #DCEFF5; --orange: #D94A00; --ok: #1E8E66; --warn: #9A6A00; --hover: #E3ECF6; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #EEF3F8; --panel: #FFFFFF; --ribbon: #F6F9FC; --line: #CBD7E6; --fg: #14233A; --muted: #55677F;
  --teal: #1B7B97; --teal-soft: #DCEFF5; --orange: #D94A00; --ok: #1E8E66; --warn: #9A6A00; --hover: #E3ECF6; color-scheme: light; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#app { height: 100%; display: flex; flex-direction: column; min-width: 0; }

/* title bar + Quick Access */
.title { display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
.brand b { color: var(--teal); }
.qat { display: flex; align-items: center; gap: 2px; padding-inline: 8px; border-inline: 1px solid var(--line); }
.qbtn { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; font-size: 18px; color: var(--muted); }
.qbtn:hover { background: var(--hover); color: var(--fg); }
.spacer { flex: 1; }
.demo { font-size: 12px; color: var(--warn); border: 1px solid currentColor; border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
.role { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
select { font: inherit; font-size: 13px; background: var(--ribbon); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.menu-btn { display: none; }

/* tabs */
.tabs { display: flex; align-items: flex-end; gap: 2px; padding: 4px 8px 0; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; padding: 7px 16px 8px; border-radius: 8px 8px 0 0; color: var(--muted); white-space: nowrap; border: 1px solid transparent; border-bottom: 0; }
.tab:hover { color: var(--fg); background: var(--hover); }
.tab[aria-selected="true"] { background: var(--ribbon); color: var(--fg); border-color: var(--line); font-weight: 600; margin-bottom: -1px; }
.tab.file { background: var(--teal); color: #fff; font-weight: 600; }
.collapse { margin-inline-start: auto; width: 30px; height: 28px; display: grid; place-items: center; color: var(--muted); border-radius: 6px; flex: none; }
.collapse:hover { background: var(--hover); color: var(--fg); }

/* ribbon panel */
.ribbon-wrap { position: relative; z-index: 5; }
.ribbon { display: flex; gap: 0; align-items: stretch; background: var(--ribbon); border-bottom: 1px solid var(--line); padding: 6px 8px 0; min-height: 104px; overflow-x: auto; scrollbar-width: thin; }
.ribbon.popup { position: absolute; inset-inline: 0; top: 0; box-shadow: 0 10px 24px rgba(0,0,0,.35); border-top: 1px solid var(--line); }
.group { display: flex; flex-direction: column; padding: 0 8px; border-inline-start: 1px solid var(--line); }
.group:first-child { border-inline-start: 0; }
.items { display: flex; gap: 2px; flex: 1; align-items: stretch; }
.glabel { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0 5px; white-space: nowrap; }
.rb { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 66px; padding: 6px 8px; border-radius: 6px; font-size: 13px; line-height: 1.25; text-align: center; }
.rb svg.i { font-size: 30px; color: var(--teal); }
.rb:hover { background: var(--hover); }
.rb.primary svg.i { color: var(--orange); }
.rb.off { opacity: .45; }
.stack { display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.rb.small { flex-direction: row; justify-content: flex-start; min-width: 118px; padding: 4px 8px; gap: 8px; text-align: start; }
.rb.small svg.i { font-size: 17px; }
.tip { position: absolute; inset-inline-start: 50%; transform: translateX(-50%); top: -3px; min-width: 22px; height: 22px; padding: 0 5px; display: grid; place-items: center; background: #1b1b1b; color: #fff; border: 1px solid #fff5; border-radius: 4px; font-size: 13px; font-weight: 700; z-index: 20; pointer-events: none; }
:root[data-theme="light"] .tip { background: #14233A; }
.tab .tip { top: -6px; }

/* work area */
main { flex: 1; min-height: 0; overflow: auto; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 14px max(16px, env(safe-area-inset-right, 0px)); }
h2 { margin: 0 0 12px; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h2 svg.i { color: var(--teal); font-size: 22px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 130px; flex: 1; }
.field label { font-size: 12px; color: var(--muted); }
.field .v { background: var(--ribbon); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-height: 36px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; background: var(--panel); }
th { text-align: start; font-size: 12px; color: var(--muted); font-weight: 600; background: var(--ribbon); }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
tr.sel td { background: var(--teal-soft); }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
.pill.warn { color: var(--warn); } .pill.ok { color: var(--ok); } .pill.bad { color: var(--orange); }
.totals { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; margin-top: 12px; }
.net { flex: 1; min-width: 200px; background: var(--teal-soft); border: 1px solid var(--teal); border-radius: 10px; padding: 10px 14px; }
.net small { color: var(--muted); display: block; }
.net strong { font-size: 30px; font-variant-numeric: tabular-nums; }
.mini { color: var(--muted); font-size: 13px; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 160px; }
input.search { width: min(360px, 100%); font: inherit; background: var(--ribbon); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; }
.btn { background: var(--teal); color: #fff; border-radius: 6px; padding: 6px 12px; font-size: 13px; }
.btn.ghost { background: var(--ribbon); color: var(--fg); border: 1px solid var(--line); }
.hint { color: var(--muted); font-size: 13px; margin-top: 12px; }
kbd { font-family: var(--font); background: var(--ribbon); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; font-size: 12px; }

/* status bar */
.status { display: flex; align-items: center; gap: 14px; padding: 5px 12px; font-size: 12px; background: var(--teal); color: #fff; flex-wrap: wrap; }
.status button { color: #fff; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #7CFFC4; margin-inline-end: 5px; }
.dot.off { background: #FFB28A; }
.toast { position: fixed; inset-inline: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); margin-inline: auto; width: max-content; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); border-radius: 8px; padding: 8px 14px; font-size: 14px; z-index: 50; }

/* phone: ribbon becomes a side menu */
.drawer-bg { position: fixed; inset: 0; background: #0009; z-index: 40; }
.drawer { position: fixed; inset-block: 0; inset-inline-start: 0; width: min(86vw, 340px); background: var(--panel); border-inline-end: 1px solid var(--line); z-index: 41; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 16px; }
.drawer h3 { margin: 0; padding: 10px 16px; font-size: 14px; color: var(--teal); }
.drawer details { border-top: 1px solid var(--line); }
.drawer summary { padding: 12px 16px; cursor: pointer; font-weight: 600; }
.drawer .grp { padding: 4px 16px 2px; font-size: 12px; color: var(--muted); }
.drawer .rb { flex-direction: row; justify-content: flex-start; gap: 12px; width: 100%; border-radius: 0; padding: 11px 16px 11px 16px; font-size: 15px; text-align: start; }
.drawer .rb svg.i { font-size: 20px; }
.bbar { display: none; }
@media (max-width: 760px) {
  .bbar { display: flex; position: sticky; bottom: 0; z-index: 30; background: var(--panel); border-top: 1px solid var(--line); }
  .bbar button { flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: 0; color: var(--text, inherit); font: inherit; font-size: 12px; cursor: pointer; }
  .bbar button.on { color: var(--teal); font-weight: 700; }
  .bbar svg.i { font-size: 22px; }
  table { min-width: 440px; }
  .tabs, .ribbon-wrap, .qat, .demo, .collapse { display: none; }
  .menu-btn { display: grid; }
  .title { padding: 8px 12px; }
  .role span { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .ribbon.popup { animation: drop .12s ease-out; } @keyframes drop { from { opacity: 0; transform: translateY(-4px); } } }
</style>

const visTabs = () => TABS.filter(t => t.roles.includes(S.role));
const visItems = g => g.items.filter(i => !i.roles || i.roles.includes(S.role));
const curTab = () => visTabs().find(t => t.id === S.tab) || visTabs()[0];
let toastTimer;
function toast(m) { S.toast = m; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; render(); }, 2200); }

/* ---------- ribbon ---------- */
const tipHTML = k => (S.tips && AR[k]) ? `<span class="tip">${AR[k]}</span>` : '';
function itemBtn(i, small, showTip) {
  return `<button class="rb${small ? ' small' : ''}${i.primary ? ' primary' : ''}" data-run="${i.id}" title="${i.label}">${icon(i.icon)}<span>${i.label}</span>${showTip ? tipHTML(i.key) : ''}</button>`;
}
function ribbonHTML() {
  const t = curTab(), showItemTips = S.tips === 'items';
  return t.groups.map(g => { const its = visItems(g); if (!its.length) return '';
    return `<div class="group" role="group" aria-label="${g.label}"><div class="items">${g.stack ? `<div class="stack">${its.map(i => itemBtn(i, 1, showItemTips)).join('')}</div>` : its.map(i => itemBtn(i, 0, showItemTips)).join('')}</div><div class="glabel">${g.label}</div></div>`; }).join('');
}
function drawerHTML() {
  return `<div class="drawer-bg" data-close="1"></div><nav class="drawer" aria-label="القائمة"><h3><span dir="ltr">O Pharmacy</span> <button class="qbtn" style="float:left" data-close="1" aria-label="إغلاق">${icon('x')}</button></h3>${visTabs().map(t => `<details${t.id === S.tab ? ' open' : ''}><summary>${t.label}</summary>${t.groups.map(g => { const its = visItems(g); return its.length ? `<div class="grp">${g.label}</div>${its.map(i => itemBtn(i, 0, 0)).join('')}` : ''; }).join('')}</details>`).join('')}</nav>`;
}
function render() {
  const t = curTab(), expanded = !S.collapsed || S.popup;
  $('#app').innerHTML = `
  <header class="title">
    <button class="qbtn menu-btn" data-open="1" aria-label="القائمة">${icon('menu')}</button>
    <span class="brand" dir="ltr">O <b>Pharmacy</b></span>
    <div class="qat" role="toolbar" aria-label="شريط الوصول السريع">
      <button class="qbtn" data-run="save" title="حفظ">${icon('save')}</button><button class="qbtn" data-run="undo" title="تراجع">${icon('undo')}</button>
      <button class="qbtn" data-run="sale" title="فاتورة بيع جديدة">${icon('cart')}</button><button class="qbtn" data-run="print" title="طباعة">${icon('print')}</button>
      <button class="qbtn" data-tips="1" title="اختصارات لوحة المفاتيح (Alt)">${icon('kbd')}</button></div>
    <span class="demo">نموذج تجريبي - ليس نظامًا حقيقيًا</span><span class="spacer"></span>
    <label class="role"><span>الدور:</span><select id="role" aria-label="الدور">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}"${k === S.role ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
  </header>
  <div class="tabs" role="tablist" aria-label="تبويبات الشريط">
    ${visTabs().map(x => `<button class="tab${x.id === 'file' ? ' file' : ''}" role="tab" aria-selected="${x.id === t.id}" data-tab="${x.id}">${x.label}${S.tips === 'tabs' ? tipHTML(x.key) : ''}</button>`).join('')}
    <button class="collapse" data-collapse="1" title="${S.collapsed ? 'تثبيت الشريط (Ctrl+F1)' : 'طيّ الشريط (Ctrl+F1)'}" aria-label="طيّ أو تثبيت الشريط">${icon(S.collapsed ? 'down' : 'up')}</button>
  </div>
  <div class="ribbon-wrap">${expanded ? `<div class="ribbon${S.collapsed ? ' popup' : ''}" role="tabpanel">${ribbonHTML()}</div>` : ''}</div>
  <main id="work">${screenHTML()}</main>
  <nav class="bbar" aria-label="تنقل سريع">${[['sale','فاتورة بيع','cart'],['items','الأصناف','box'],['short','النواقص','bell'],['del','المحذوفات','trash']].filter(x => x[0] !== 'del' || ['owner','manager'].includes(S.role)).map(x => `<button data-go="${x[0]}" class="${S.screen === x[0] ? 'on' : ''}">${icon(x[2])}<span>${x[1]}</span></button>`).join('')}<button data-open="1">${icon('menu')}<span>القائمة</span></button></nav>
  <footer class="status"><span><span class="dot${S.offline ? ' off' : ''}"></span>${S.offline ? 'بدون إنترنت - البيع شغال والمزامنة مؤجلة' : 'متصل بالـ Hub والسحابة'}</span><button data-offline="1">${S.offline ? 'رجّع الاتصال' : 'جرّب قطع الإنترنت'}</button><span class="spacer"></span><span>فرع التجربة</span><span>${ROLES[S.role]}</span></footer>
  ${S.drawer ? drawerHTML() : ''}${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ''}`;
}

/* ---------- screens ---------- */
function totals() { return S.lines.reduce((s, i) => s + ITEMS[i][1], 0); }
function screenHTML() {
  if (S.screen === 'items') {
    const rows = ITEMS.map((x, i) => [x, i]).filter(([x]) => !S.q || x[0].includes(S.q));
    return `<h2>${icon('box')}قائمة الأصناف</h2><input class="search" id="q" placeholder="اكتب جزء من الاسم" value="${S.q}" aria-label="بحث"><div class="tablewrap"><table><thead><tr><th>الكود</th><th>الصنف</th><th class="n">السعر</th><th class="n">الرصيد</th><th>أقرب صلاحية</th></tr></thead><tbody>${rows.map(([x, i]) => `<tr><td>${AD(1001 + i)}</td><td>${x[0]}</td><td class="n">${money(x[1])}</td><td class="n">${x[2] === 0 ? '<span class="pill bad">نفد</span>' : AD(x[2])}</td><td>${AD(x[3])}</td></tr>`).join('') || '<tr><td colspan="5">لا نتائج</td></tr>'}</tbody></table></div>`;
  }
  if (S.screen === 'short') {
    return `<h2>${icon('clip')}كشكول النواقص</h2><div class="tablewrap"><table><thead><tr><th>الصنف</th><th class="n">الرصيد</th><th>الحالة</th><th></th></tr></thead><tbody>${ITEMS.map((x, i) => [x, i]).filter(([x, i]) => x[2] === 0 || S.short[i]).map(([x, i]) => `<tr><td>${x[0]}</td><td class="n">${AD(x[2])}</td><td>${S.short[i] ? '<span class="pill warn">مطلوب</span>' : '<span class="pill">غير مطلوب</span>'}</td><td><button class="btn ghost" data-short="${i}">${S.short[i] ? 'إلغاء الطلب' : 'اطلبه'}</button></td></tr>`).join('')}</tbody></table></div><p class="hint">من شاشة البيع، محاولة بيع صنف نفد بتضيفه هنا بضغطة واحدة، وبتظهر كمياته في الفروع التانية (كميات فقط).</p>`;
  }
  if (S.screen === 'del') {
    const d = [['فاتورة بيع رقم ١٠٤٥١', 'إلغاء بعد الحفظ', 'كاشير 2', 'العميل غيّر رأيه'], ['سطر: فيتامين سي فوار', 'حذف من فاتورة', 'كاشير 1', 'خطأ في الصنف']].filter((_, i) => !S.hidden.includes(i));
    return `<h2>${icon('trash')}المحذوفات</h2><p class="hint" style="margin-top:0">الموظف لا يرى هذه الشاشة ولا يرى أن شيئًا اتحذف. الإدارة ترى كل شيء: مين ومتى وليه، وتقدر ترجّعه.</p><div class="tablewrap"><table><thead><tr><th>العنصر</th><th>النوع</th><th>بواسطة</th><th>السبب</th><th></th></tr></thead><tbody>${d.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><button class="btn" data-restore="1">استرجاع</button></td></tr>`).join('') || '<tr><td colspan="5">لا يوجد</td></tr>'}</tbody></table></div>`;
  }
  const cost = ['owner', 'manager'].includes(S.role), tot = totals();
  return `<h2>${icon('cart')}فاتورة بيع</h2>
  <div class="row"><div class="field"><label>نوع الفاتورة</label><div class="v">كاش</div></div><div class="field"><label>مخزن البيع</label><div class="v">الصيدلية</div></div><div class="field"><label>العميل</label><div class="v">عميل نقدي</div></div><div class="field"><label>البائع</label><div class="v">${ROLES[S.role]}</div></div></div>
  <div class="tablewrap"><table><thead><tr><th>#</th><th>الصنف</th><th>الصلاحية</th><th class="n">الكمية</th><th class="n">السعر</th><th class="n">القيمة</th></tr></thead><tbody>${S.lines.map((i, n) => `<tr class="${n === S.lines.length - 1 ? 'sel' : ''}"><td>${AD(n + 1)}</td><td>${ITEMS[i][0]}</td><td>${AD(ITEMS[i][3])}</td><td class="n">${AD(1)}</td><td class="n">${money(ITEMS[i][1])}</td><td class="n">${money(ITEMS[i][1])}</td></tr>`).join('') || '<tr><td colspan="6">الفاتورة فاضية - اضغط «إضافة سطر» من الشريط</td></tr>'}</tbody></table></div>
  <div class="totals"><div class="net"><small>الصافي المطلوب</small><strong>${money(tot)}</strong></div><div class="mini"><span>عدد الأصناف: ${AD(S.lines.length)}</span>${cost ? `<span>تكلفة الفاتورة: ${money(Math.round(tot * .78))}</span><span>ربح الفاتورة: ${money(tot - Math.round(tot * .78))}</span>` : '<span>التكلفة والربح مخفيّان عن هذا الدور</span>'}</div></div>
  <p class="hint">جرّب: اضغط <kbd>Alt</kbd> لتظهر حروف الاختصار على التبويبات، أو <kbd>Ctrl</kbd>+<kbd>F1</kbd> لطيّ الشريط، أو غيّر «الدور» من فوق وشوف الشريط وهو بيتغيّر. على الموبايل الشريط بيبقى قائمة جانبية.</p>`;
}

/* ---------- actions ---------- */
function run(id) {
  let found; TABS.forEach(t => t.groups.forEach(g => g.items.forEach(i => { if (i.id === id || (id === 'sale' && i.id === 'sale')) found = found || i; })));
  S.tips = null; S.drawer = false; S.popup = false;
  if (id === 'addline') { const next = ITEMS.findIndex((x, i) => x[2] > 0 && !S.lines.includes(i)); if (next >= 0) S.lines.push(next); S.screen = 'sale'; render(); return; }
  if (id === 'delline') { S.lines.pop(); S.screen = 'sale'; render(); return; }
  if (found && found.screen) { S.screen = found.screen; render(); return; }
  if (id === 'sale') { S.screen = 'sale'; render(); return; }
  toast(`«${found ? found.label : id}» ضمن Phase 1 - مش متعمل في النموذج ده`);
}
function selectTab(id, popup) { S.tab = id; if (S.collapsed) S.popup = popup !== false; render(); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-run],[data-collapse],[data-offline],[data-open],[data-close],[data-tips],[data-short],[data-restore]');
  if (!t) { if (S.popup) { S.popup = false; render(); } return; }
  const d = t.dataset;
  if (d.tab) { if (S.collapsed && S.tab === d.tab && S.popup) { S.popup = false; render(); } else selectTab(d.tab); }
  else if (d.go) { S.screen = d.go; S.drawer = false; render(); } else if (d.run) run(d.run);
  else if (d.collapse) { S.collapsed = !S.collapsed; S.popup = false; try { localStorage.setItem('ribbon-collapsed', S.collapsed ? '1' : '0'); } catch (x) {} render(); }
  else if (d.offline) { S.offline = !S.offline; render(); }
  else if (d.open) { S.drawer = true; render(); } else if (d.close) { S.drawer = false; render(); }
  else if (d.tips) { S.tips = S.tips ? null : 'tabs'; render(); }
  else if (d.short) { S.short[d.short] = S.short[d.short] ? 0 : 1; render(); }
  else if (d.restore) { S.hidden.push(S.hidden.length); toast('اتسترجع، وسُجّلت العملية باسمك'); }
});
document.addEventListener('dblclick', e => { if (e.target.closest('[data-tab]')) { S.collapsed = !S.collapsed; S.popup = false; try { localStorage.setItem('ribbon-collapsed', S.collapsed ? '1' : '0'); } catch (x) {} render(); } });
document.addEventListener('change', e => { if (e.target.id === 'role') { S.role = e.target.value; if (!visTabs().some(t => t.id === S.tab)) S.tab = 'home'; if (S.screen === 'del' && !['owner', 'manager'].includes(S.role)) S.screen = 'sale'; render(); } });
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } } });
let altDown = false;
document.addEventListener('keydown', e => {
  if (e.key === 'Alt' && !e.repeat) { altDown = true; e.preventDefault(); return; }
  if (altDown && e.key !== 'Alt') altDown = false;
  if (e.ctrlKey && e.key === 'F1') { e.preventDefault(); $('[data-collapse]').click(); return; }
  if (e.key === 'Escape') { if (S.tips === 'items') S.tips = 'tabs'; else if (S.tips) S.tips = null; else S.popup = false; S.drawer = false; render(); return; }
  if (S.tips && AR[e.code]) {
    e.preventDefault();
    if (S.tips === 'tabs') { const t = visTabs().find(x => x.key === e.code); if (t) { S.tab = t.id; S.popup = S.collapsed; S.tips = 'items'; render(); } }
    else { let hit; curTab().groups.forEach(g => visItems(g).forEach(i => { if (i.key === e.code) hit = i; })); if (hit) run(hit.id); }
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const el = document.activeElement; if (el && el.matches('.tab')) { const ts = visTabs(), k = ts.findIndex(x => x.id === el.dataset.tab), n = ts[(k + (e.key === 'ArrowLeft' ? 1 : -1) + ts.length) % ts.length]; selectTab(n.id, false); document.querySelector(`[data-tab="${n.id}"]`).focus(); } }
});
document.addEventListener('keyup', e => { if (e.key === 'Alt' && altDown) { altDown = false; S.tips = S.tips ? null : 'tabs'; render(); } });
render();
</script>
